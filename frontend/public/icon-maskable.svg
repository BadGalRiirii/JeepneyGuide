  <circle cx="172" cy="378" r="22" fill="#374151"/>
  <circle cx="172" cy="378" r="10" fill="#f59e0b"/>
  <circle cx="340" cy="378" r="38" fill="#1e293b"/>
  <circle cx="340" cy="378" r="22" fill="#374151"/>
  <circle cx="340" cy="378" r="10" fill="#f59e0b"/>
